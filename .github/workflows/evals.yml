name: Agent evals

# Runs the paid `claude plugin eval` suites under evals/, one job per suite, and
# gates on a pass-rate floor and, for test-engineer, on the mutant gate. See
# evals/README.md. Offline validation of the case files runs with every other
# Go test in the validation workflow.

on:
  workflow_dispatch:
    inputs:
      pass_floor:
        description: Minimum with-arm score (0 to 1) every case must reach
        default: '0.8'
      max_cost_usd:
        description: List-price cost ceiling per suite, in US dollars
        default: '5'
      suites:
        description: Space-separated suite directories under evals/ (empty runs all)
        default: ''
      model:
        description: Model for the agent under test (--model); the default is the Opus model the agents pin (model opus), so a run uses Opus whether the runner applies --model to the dispatched agent or to the dispatching session
        default: claude-opus-5-5
      judge_model:
        description: Model for llm graders (--judge-model)
        default: claude-haiku-5-5
      claude_code_version:
        description: npm version of @anthropic-ai/claude-code
        default: 2.1.316
  schedule:
    # Mondays 05:17 UTC.
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: agent-evals
  cancel-in-progress: false

env:
  PASS_FLOOR: ${{ inputs.pass_floor || '0.8' }}
  MAX_COST_USD: ${{ inputs.max_cost_usd || '5' }}
  EVAL_MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
  JUDGE_MODEL: ${{ inputs.judge_model || 'claude-haiku-5-5' }}
  CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version || '2.1.316' }}

jobs:
  plan:
    name: Plan suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.secret.outputs.enabled }}
      suites: ${{ steps.suites.outputs.suites }}
    steps:
      - name: Check for the API key
        id: secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice title=Agent evals skipped::Repository secret ANTHROPIC_API_KEY is not set, so no paid eval ran."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out exact source
        if: steps.secret.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List suites
        id: suites
        if: steps.secret.outputs.enabled == 'true'
        env:
          REQUESTED: ${{ inputs.suites }}
        run: |
          # A suite is a directory under evals/ whose subdirectories hold cases.
          all=$(find evals -mindepth 3 -maxdepth 3 \( -name case.yaml -o -name prompt.md \) | cut -d/ -f2 | sort -u)
          if [ -n "$REQUESTED" ]; then
            for suite in $REQUESTED; do
              printf '%s\n' "$all" | grep -qx -- "$suite" || { echo "::error::unknown suite $suite (have: $(echo $all))"; exit 1; }
            done
            all=$(printf '%s\n' $REQUESTED | sort -u)
          fi
          echo "suites=$(printf '%s\n' "$all" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  suite:
    name: Eval / ${{ matrix.suite }}
    needs: plan
    if: needs.plan.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    # Cases allow up to 30 minutes each and run one at a time.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    env:
      GOWORK: 'off'
      GOFLAGS: '-mod=mod'
      SUITE: ${{ matrix.suite }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Go with dependency cache
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Claude Code and the Bash sandbox prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
          # which stops bubblewrap; every suite grants Bash, and Claude Code
          # refuses a Bash-granted run that cannot start its sandbox.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Fail here, before any paid run, if the sandbox still cannot start.
          bwrap --unshare-user --ro-bind / / true
          npm install --global --no-fund --no-audit "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          claude --version
      - name: Run the suite
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Kept run directories land here, away from the runner's other files.
          TMPDIR: ${{ runner.temp }}/eval-tmp
          OUT: ${{ runner.temp }}/eval-out
        run: |
          mkdir -p "$TMPDIR" "$OUT"
          set +e
          claude plugin eval . --tag "$SUITE" --ablation none --scaffold --trust-plugin --keep-temp \
            --no-publish --model "$EVAL_MODEL" --judge-model "$JUDGE_MODEL" \
            --threshold "$PASS_FLOOR" --max-cost-usd "$MAX_COST_USD" \
            --allow-tools Write Edit "Bash(go *)" \
            --json "$OUT/result.json" 2> "$OUT/stderr.log"
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 40 "$OUT/stderr.log"
          # Keep only the run workspaces, found by the contract the scaffold copies
          # into each, never the runs' temporary home directories. A directory
          # with a prompt.md is a copy of the case itself, not a workspace.
          find "$TMPDIR" -type f -path '*/testdata/contract/interface-contract.md' | while IFS= read -r contract; do
            workspace=${contract%/testdata/contract/interface-contract.md}
            [ -e "$workspace/prompt.md" ] && continue
            dest="$OUT/workspaces/$(printf '%s' "$workspace" | sha256sum | cut -c1-12)"
            mkdir -p "$dest"
            cp -R "$workspace/." "$dest/"
          done
      - name: Upload results and workspaces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-${{ matrix.suite }}-${{ github.run_id }}
          path: ${{ runner.temp }}/eval-out/
          if-no-files-found: warn
          retention-days: 30
      - name: Gate on the pass-rate floor
        if: always() && steps.run.outcome == 'success'
        env:
          EVAL_RESULT_JSON: ${{ runner.temp }}/eval-out/result.json
          EVAL_PASS_FLOOR: ${{ env.PASS_FLOOR }}
          STATUS: ${{ steps.run.outputs.status }}
        run: |
          go test ./evals/ -run '^TestEvalResult$' -count=1 -v
          if [ "$STATUS" != 0 ]; then
            echo "::error::claude plugin eval exited $STATUS (1: a case below the floor, a load or API error; 2: the cost ceiling or credentials stopped the run). See stderr.log in the uploaded artifact."
            exit 1
          fi
      - name: Gate the test-engineer tests on mutants
        if: always() && matrix.suite == 'test-engineer' && steps.run.outcome == 'success'
        env:
          EVAL_ARTEFACTS_DIR: ${{ runner.temp }}/eval-out/workspaces
        run: go test ./evals/ -run '^TestMutantGate$' -count=1 -v
