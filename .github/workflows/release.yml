name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag is released only from the configured repository when its commit is
  # on main and a CI run for exactly that commit passed.
  guard:
    name: Repository matches and commit passed CI on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Refuse publication outside the Kitsu repository
        run: |
          if [ "$GITHUB_REPOSITORY" != "belevtsev/kitsu" ]; then
            echo "Kitsu releases must run in belevtsev/kitsu."
            exit 1
          fi
      - name: Check out the tagged commit with the history of main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a commit that is not on main or did not pass CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh .github/scripts/release-guard.sh "$GITHUB_SHA"
      # The last job follows the install instruction of the release-install document, after the
      # release is public. A release-install document that names another tag is refused here.
      - name: Refuse a tag that the release-install document does not install
        run: |
          if ! grep -qxF "tag=$GITHUB_REF_NAME" docs/release-install.md || ! grep -qxF "\$tag = \"$GITHUB_REF_NAME\"" docs/release-install.md; then
            echo "The install instructions of docs/release-install.md do not install $GITHUB_REF_NAME."
            exit 1
          fi

  # The same tools and versions as the jobs of ci.yml.
  verify:
    name: Test, lint and vulnerabilities
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GOWORK: 'off'
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Go with dependency cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with the race detector
        run: go test -race -count=1 ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
      - name: Lint the darwin build
        env:
          GOOS: darwin
        run: golangci-lint run ./...
      - name: Lint the windows build
        env:
          GOOS: windows
        run: golangci-lint run ./...
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check reachable vulnerabilities
        run: govulncheck ./...
      - name: Check reachable vulnerabilities in the darwin build
        env:
          GOOS: darwin
        run: govulncheck ./...
      - name: Check reachable vulnerabilities in the windows build
        env:
          GOOS: windows
        run: govulncheck ./...

  # Only this job can write: it publishes the release and the attestations.
  release:
    name: Publish Kitsu for ${{ github.ref_name }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GOWORK: 'off'
    steps:
      - name: Check out the tagged commit with history for the changelog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # goreleaser runs syft to make one SBOM per archive.
      - name: Install pinned syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      # The text of the release is the section of the changelog.
      - name: Take the release notes from the changelog
        run: sh .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Build archives, SBOMs and SHA256SUMS, and upload them to a draft release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # A commit can carry two tags; this run releases the one that started it.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      - name: Attest the build of each archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            install.sh
            install.ps1
      # .goreleaser.yaml makes the release a draft. It becomes public only
      # here, so a failed attestation leaves nothing public.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  # Download each installer from the published release and exercise it with
  # neither Go nor Git on PATH, including both supported PowerShell versions.
  install:
    name: Install ${{ github.ref_name }} without Go / ${{ matrix.os }}
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    env:
      GOWORK: 'off'
      KITSU_INSTALL_TAG: ${{ github.ref_name }}
      KITSU_INSTALL_REVISION: ${{ github.sha }}
      KITSU_INSTALL_PUBLISHED: '1'
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Go for the test harness
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the published release without build tools
        run: go test -count=1 -v -run TestPublishedReleaseInstaller ./scenarios/installers
