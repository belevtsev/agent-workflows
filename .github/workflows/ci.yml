name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Validate an obsolete pull request head only once.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Go packages are tested in three shards per system, so that each job
  # takes about a third as long as one job for all of them. The shards are not
  # required checks: the two jobs named "Native Go / <system>" below are, and each
  # passes only when all of its shards pass.
  go-linux:
    name: Go shard ${{ matrix.shard }} of 3 / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      GOWORK: 'off'
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test this shard
        uses: ./.github/actions/go-test
        with:
          shard: ${{ matrix.shard }}

  go-macos:
    name: Go shard ${{ matrix.shard }} of 3 / macos-latest
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      GOWORK: 'off'
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test this shard
        uses: ./.github/actions/go-test
        with:
          shard: ${{ matrix.shard }}

  # always() makes these run after a failed or cancelled shard too: a skipped
  # required check would count as passed.
  go-linux-result:
    name: Native Go / ubuntu-latest
    needs: go-linux
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        env:
          RESULT: ${{ needs.go-linux.result }}
        run: |
          echo "Go shards on ubuntu-latest: $RESULT"
          test "$RESULT" = success

  go-macos-result:
    name: Native Go / macos-latest
    needs: go-macos
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        env:
          RESULT: ${{ needs.go-macos.result }}
        run: |
          echo "Go shards on macos-latest: $RESULT"
          test "$RESULT" = success

  lint:
    name: Lint and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Go with dependency cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # goinstall builds the pinned linter with the Go that go.mod selects, so
      # it can load this module's Go version. .golangci.yml holds the linters.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
      # The runner is Linux; this also lints the darwin-only files.
      - name: Lint the darwin build
        env:
          GOOS: darwin
        run: golangci-lint run ./...
      # Pinned so a new govulncheck release cannot fail CI without a
      # repository change; new vulnerability data still can, by design.
      # Installed for the runner, so the darwin step below can still run it.
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check reachable vulnerabilities
        run: govulncheck ./...
      # Releases also ship darwin binaries; this checks the darwin build.
      - name: Check reachable vulnerabilities in the darwin build
        env:
          GOOS: darwin
        run: govulncheck ./...

  plugins:
    name: Plugin manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned so a validator release cannot fail CI without a repository change.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.316
      - name: Validate the plugins
        run: |
          claude plugin validate .
          claude plugin validate ./third_party/cc-skills-golang
