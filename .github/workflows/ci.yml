name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Validate an obsolete pull request head only once.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Native Go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GOWORK: 'off'
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Go with dependency cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted="$(git ls-files -z '*.go' ':!:third_party/**' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt needed:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      # Race checks run once, on Linux, where they cover every package.
      - name: Test with the race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      # cmd/cw takes over eight minutes on macOS runners, near go test's
      # 10-minute default for one package.
      - name: Test
        if: runner.os != 'Linux'
        run: |
          # TEMPORARY (Q2 measurement, reverted in the next commit): print the
          # slowest tests and the cost of a process start on this runner.
          status=0
          go test -json -count=1 -timeout=15m ./... > "$RUNNER_TEMP/test.json" || status=$?
          echo "Q2-PACKAGES"
          jq -r 'select(.Test == null and (.Action == "pass" or .Action == "fail")) | "\(.Elapsed)\t\(.Action)\t\(.Package)"' "$RUNNER_TEMP/test.json" | sort -rn | head -20
          echo "Q2-SLOWEST"
          jq -r 'select(.Test != null and (.Action == "pass" or .Action == "fail")) | select(.Test | contains("/") | not) | "\(.Elapsed)\t\(.Package)\t\(.Test)"' "$RUNNER_TEMP/test.json" | sort -rn | head -120
          echo "Q2-SLOWEST-SUBTESTS"
          jq -r 'select(.Test != null and (.Action == "pass" or .Action == "fail")) | select(.Test | contains("/")) | "\(.Elapsed)\t\(.Package)\t\(.Test)"' "$RUNNER_TEMP/test.json" | sort -rn | head -40
          if [ "$status" -ne 0 ]; then
            echo "Q2-FAILURES"
            jq -r 'select(.Action == "fail") | "\(.Package)\t\(.Test)"' "$RUNNER_TEMP/test.json"
            jq -r 'select(.Action == "output") | .Output' "$RUNNER_TEMP/test.json" | grep -E '^\s*(--- FAIL|FAIL|panic:)|_test\.go:[0-9]+:' | head -200 || true
          fi
          echo "Q2-PROCESS-STARTS (20 of each)"
          go build -o "$RUNNER_TEMP/cw" ./cmd/cw
          time (for i in $(seq 20); do git init -q "$RUNNER_TEMP/repo$i"; done)
          time (for i in $(seq 20); do git -C "$RUNNER_TEMP/repo1" status --porcelain > /dev/null; done)
          time (for i in $(seq 20); do go version > /dev/null; done)
          time (for i in $(seq 20); do go env GOROOT > /dev/null; done)
          time (for i in $(seq 20); do "$RUNNER_TEMP/cw" --help > /dev/null 2>&1 || true; done)
          time (for i in $(seq 20); do cp "$RUNNER_TEMP/cw" "$RUNNER_TEMP/cw-copy$i"; "$RUNNER_TEMP/cw-copy$i" --help > /dev/null 2>&1 || true; done)
          time (for i in $(seq 5); do go list ./... > /dev/null; done)
          time (go build -o "$RUNNER_TEMP/cw2" ./cmd/cw)
          sysctl -n hw.ncpu || true
          exit "$status"

  lint:
    name: Lint and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Go with dependency cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # goinstall builds the pinned linter with the Go that go.mod selects, so
      # it can load this module's Go version. .golangci.yml holds the linters.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
      # The runner is Linux; this also lints the darwin-only files.
      - name: Lint the darwin build
        env:
          GOOS: darwin
        run: golangci-lint run ./...
      # Pinned so a new govulncheck release cannot fail CI without a
      # repository change; new vulnerability data still can, by design.
      # Installed for the runner, so the darwin step below can still run it.
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check reachable vulnerabilities
        run: govulncheck ./...
      # Releases also ship darwin binaries; this checks the darwin build.
      - name: Check reachable vulnerabilities in the darwin build
        env:
          GOOS: darwin
        run: govulncheck ./...

  plugins:
    name: Plugin manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned so a validator release cannot fail CI without a repository change.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.316
      - name: Validate the plugins
        run: |
          claude plugin validate .
          claude plugin validate ./third_party/cc-skills-golang
