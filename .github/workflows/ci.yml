name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Validate an obsolete pull request head only once.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job names are the required checks of the branch protection:
  # "Native Go / ubuntu-latest" and "Native Go / macos-latest". The Windows
  # job is not required until the owner makes it so.
  go:
    name: Native Go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GOWORK: 'off'
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        uses: ./.github/actions/go-test
      # Success measure 2: the time of one hook decision. The plain test run
      # above skips it. The harness builds cw with go build and no -race, and
      # this step runs without -race. On Windows it reports only.
      - name: Measure the hook cost
        shell: bash
        env:
          CW_COST: '1'
        run: go test -count=1 -v ./scenarios/cost/

  lint:
    name: Lint and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Go with dependency cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # goinstall builds the pinned linter with the Go that go.mod selects, so
      # it can load this module's Go version. .golangci.yml holds the linters.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
      # The runner is Linux; these also lint the files of the other systems.
      - name: Lint the darwin build
        env:
          GOOS: darwin
        run: golangci-lint run ./...
      - name: Lint the windows build
        env:
          GOOS: windows
        run: golangci-lint run ./...
      # Pinned so a new govulncheck release cannot fail CI without a
      # repository change; new vulnerability data still can, by design.
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check reachable vulnerabilities
        run: govulncheck ./...
      - name: Check reachable vulnerabilities in the darwin build
        env:
          GOOS: darwin
        run: govulncheck ./...
      - name: Check reachable vulnerabilities in the windows build
        env:
          GOOS: windows
        run: govulncheck ./...

  # This repository uses its own gate. `cw run --base` counts a check as
  # passed on the base revision, so only the checks whose content changed run.
  # Never run so far: the job was written on a branch that was not pushed.
  gate:
    name: Gate / cw run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: 'off'
    steps:
      - name: Check out exact source with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pinned Go with dependency cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The check `lint` of cw.toml needs the linter on PATH.
      - name: Install the pinned linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
      # The check `record` of cw.toml needs cw itself on PATH.
      - name: Build cw
        run: |
          go build -o "$RUNNER_TEMP/cw-bin/cw" ./cmd/cw
          echo "$RUNNER_TEMP/cw-bin" >> "$GITHUB_PATH"
      - name: Run the declared checks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            cw run --base "$BASE"
          else
            cw run
          fi

  plugins:
    name: Plugin manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned so a validator release cannot fail CI without a repository change.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.316
      - name: Validate the plugin
        run: claude plugin validate .
