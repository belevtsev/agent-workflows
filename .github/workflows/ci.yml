name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      thorough:
        description: Run the race detector on macOS and Windows too, and the tests that wait ten minutes
        type: boolean
        default: false

permissions:
  contents: read

# Validate an obsolete pull request head only once.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job names are the required checks of the branch protection:
  # "Native Go / ubuntu-latest" and "Native Go / macos-latest". The Windows
  # job is not required until the owner makes it so.
  go:
    name: Native Go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.thorough && 50 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GOWORK: 'off'
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        uses: ./.github/actions/go-test
        with:
          thorough: ${{ inputs.thorough }}
      # Success measure 2: the time of one hook decision. The plain test run
      # above skips it. The harness builds kitsu with go build and no -race, and
      # this step runs without -race. On Windows it reports only.
      - name: Measure the hook cost
        shell: bash
        env:
          KITSU_COST: '1'
        run: go test -count=1 -v ./scenarios/cost/

  lint:
    name: Lint and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Go with dependency cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # goinstall builds the pinned linter with the Go that go.mod selects, so
      # it can load this module's Go version. .golangci.yml holds the linters.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
      # The runner is Linux; these also lint the files of the other systems.
      - name: Lint the darwin build
        env:
          GOOS: darwin
        run: golangci-lint run ./...
      - name: Lint the windows build
        env:
          GOOS: windows
        run: golangci-lint run ./...
      # Pinned so a new govulncheck release cannot fail CI without a
      # repository change; new vulnerability data still can, by design.
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check reachable vulnerabilities
        run: govulncheck ./...
      - name: Check reachable vulnerabilities in the darwin build
        env:
          GOOS: darwin
        run: govulncheck ./...
      - name: Check reachable vulnerabilities in the windows build
        env:
          GOOS: windows
        run: govulncheck ./...

  # This repository uses its own gate. `kitsu run --base` counts a check as
  # passed on the base revision, so only the checks whose content changed run.
  gate:
    name: Gate / kitsu run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: 'off'
    steps:
      - name: Check out exact source with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pinned Go with dependency cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The check `lint` of kitsu.toml needs the linter on PATH.
      - name: Install the pinned linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
      # The check `record` of kitsu.toml needs kitsu itself on PATH.
      - name: Build kitsu
        run: |
          go build -o "$RUNNER_TEMP/kitsu-bin/kitsu" ./cmd/kitsu
          echo "$RUNNER_TEMP/kitsu-bin" >> "$GITHUB_PATH"
      - name: Run the declared checks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            kitsu run --base "$BASE"
          else
            kitsu run
          fi

  # The archives of a release, built from this commit as release.yml builds
  # them from a tag, and published nowhere: the artifact `kitsu-archives` of the
  # run holds them. They carry the tag that the release-install document installs.
  archives:
    name: Release archives
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      revision: ${{ steps.name.outputs.revision }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Go with dependency cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Read the tag that the release-install document installs
        id: name
        run: |
          tag=$(sed -n 's/^tag=\(v[0-9][0-9A-Za-z.-]*\)$/\1/p' docs/release-install.md | head -n 1)
          if [ -z "$tag" ]; then
            echo "docs/release-install.md has no line tag=v<version>."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The same tools and versions as release.yml.
      - name: Install pinned syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      - name: Take the release notes from the changelog
        env:
          TAG: ${{ steps.name.outputs.tag }}
        run: sh .github/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Build archives, SBOMs and SHA256SUMS
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.name.outputs.tag }}
      - name: List what was built
        run: |
          cp install.sh install.ps1 dist/
          cat dist/SHA256SUMS
          for archive in dist/*.tar.gz dist/*.zip; do
            grep -q " $(basename "$archive")\$" dist/SHA256SUMS || { echo "SHA256SUMS does not list $archive"; exit 1; }
            [ -f "$archive.sbom.json" ] || { echo "$archive has no SBOM"; exit 1; }
          done
          [ "$(ls dist/*.tar.gz dist/*.zip | wc -l)" -eq 6 ] || { echo "expected six archives"; exit 1; }
          for installer in install.sh install.ps1; do
            grep -q " $installer\$" dist/SHA256SUMS || { echo "SHA256SUMS does not list $installer"; exit 1; }
          done
          cp "$RUNNER_TEMP/release-notes.md" dist/release-notes.md
      - name: Keep the archives with the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kitsu-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/SHA256SUMS
            dist/release-notes.md
            dist/install.sh
            dist/install.ps1
          if-no-files-found: error
          retention-days: 30

  # Download the standalone installers and real release archives from a local
  # HTTP fixture, then install with neither Go nor Git on the installer's PATH.
  install:
    name: Install without Go / ${{ matrix.os }}
    needs: archives
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GOWORK: 'off'
      KITSU_INSTALL_TAG: ${{ needs.archives.outputs.tag }}
      KITSU_INSTALL_REVISION: ${{ needs.archives.outputs.revision }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Go for the test harness
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kitsu-archives
          path: ${{ runner.temp }}/archives
      - name: Test standalone installers with release artifacts
        env:
          KITSU_INSTALL_ARCHIVES: ${{ runner.temp }}/archives
        run: go test -count=1 -v ./scenarios/installers

  plugins:
    name: Plugin manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned so a validator release cannot fail CI without a repository change.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.325
      - name: Validate the plugin
        run: claude plugin validate .
