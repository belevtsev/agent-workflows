version: 2
updates:
  # "/" covers .github/workflows only; the composite action pins actions too.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/go-test
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
