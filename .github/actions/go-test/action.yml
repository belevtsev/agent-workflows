name: Test the Go packages
description: >-
  Set up the pinned Go, check formatting and vet, and run every test. The race
  detector runs on Linux; a thorough run uses it on every system.

inputs:
  thorough:
    description: >-
      'true' runs the race detector on every system and the tests that wait
      ten minutes.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up pinned Go with dependency cache
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Check formatting
      shell: bash
      run: |
        unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
        if [ -n "$unformatted" ]; then
          printf 'gofmt needed:\n%s\n' "$unformatted"
          exit 1
        fi
    - name: Vet
      shell: bash
      run: go vet ./...
    # Race checks run once, on Linux, where they cover every package that is
    # not written for one system.
    - name: Test with the race detector
      if: runner.os == 'Linux' && inputs.thorough != 'true'
      shell: bash
      run: go test -race -count=1 ./...
    - name: Test
      if: runner.os != 'Linux' && inputs.thorough != 'true'
      shell: bash
      env:
        # The limit applies to an entire package. The expanded handoff suite
        # exceeded 22 minutes on the hosted Windows runner.
        PACKAGE_TIMEOUT: ${{ runner.os == 'Windows' && '30m' || '15m' }}
      run: go test -count=1 -timeout="$PACKAGE_TIMEOUT" ./...
    # A thorough run is started by hand. It also covers the code written for
    # macOS and Windows with the race detector, which needs cgo, and runs the
    # tests that wait ten minutes.
    - name: Test with the race detector and the slow tests
      if: inputs.thorough == 'true'
      shell: bash
      env:
        CGO_ENABLED: '1'
        KITSU_SLOW_TESTS: '1'
      run: go test -race -count=1 -timeout=30m ./...
