name: Test the Go packages
description: >-
  Set up the pinned Go, check formatting and vet, and run every test. The race
  detector runs on Linux.

runs:
  using: composite
  steps:
    - name: Set up pinned Go with dependency cache
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: Check formatting
      shell: bash
      run: |
        unformatted="$(git ls-files -z '*.go' ':!:_quarantine/**' | xargs -0 gofmt -l)"
        if [ -n "$unformatted" ]; then
          printf 'gofmt needed:\n%s\n' "$unformatted"
          exit 1
        fi
    - name: Vet
      shell: bash
      run: go vet ./...
    # Race checks run once, on Linux, where they cover every package.
    - name: Test with the race detector
      if: runner.os == 'Linux'
      shell: bash
      run: go test -race -count=1 ./...
    - name: Test
      if: runner.os != 'Linux'
      shell: bash
      run: go test -count=1 -timeout=15m ./...
