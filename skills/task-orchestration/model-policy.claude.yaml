version: 1

# Claude Code roles for the coordinator and its workers. Activation, consultation
# and publication rules stay in model-policy.yaml, which applies on every host.
# This file has no consultation section: an adviser takes part when the shared
# policy enables it, its credential is present, the user opted in to it, and it
# is not disabled in the user's preferences. Agent tool
# dispatch accepts aliases only, so references/hosts.md maps these profiles to
# `model: opus` or `model: sonnet` with explicit effort. Most substantive work
# runs at `high`; the `decision` profile keeps `xhigh` for planning, architecture
# and diagnosis.
profiles:
  substantive:
    model: claude-opus-5-5
    effort: high
    scope: substantive
  decision:
    model: claude-opus-5-5
    effort: xhigh
    scope: substantive
  bounded_execution:
    model: claude-opus-5-5
    effort: high
    scope: bounded_execution
  # Every later review of a stage, after that stage's first full independent
  # review: the diff-scoped follow-up, a review scoped to a fix and a
  # confirmation pass.
  review_followup:
    model: claude-sonnet-5-5
    effort: high
    scope: substantive
  github:
    model: claude-sonnet-5-5
    effort: medium
    scope: bounded_execution
  bounded_evidence:
    model: claude-opus-5-5
    effort: high
    scope: bounded_evidence

roles:
  coordinator: substantive
  coding: substantive
  planning: decision
  architecture: decision
  # Contract roles for the flow (references/contracts/README.md). Every review
  # stage runs the reviewer agent: spec_review, design_review, test_review and
  # review (code review); review_followup covers every later review of a stage.
  spec_writer: substantive
  spec_review: substantive
  architect: decision
  design_review: substantive
  implementer: substantive
  test_engineer: substantive
  test_review: substantive
  # Opt-in adversarial white-box tester (contracts/adversarial-tester.md).
  adversarial_tester: substantive
  review: substantive
  review_followup: review_followup
  diagnosis: decision
  documentation: substantive
  issue_management: substantive
  pr_authoring: substantive
  pr_authoring_routine: github
  commit_execution: github
  pr_submission: github
  lookup: bounded_evidence
  summarization: bounded_evidence

unknown_role_profile: substantive
