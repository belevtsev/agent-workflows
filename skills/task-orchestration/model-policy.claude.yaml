version: 1

# Claude Code roles for the coordinator and its workers. Activation, consultation
# and publication rules stay in model-policy.yaml, which applies on every host.
# This file has no consultation section: an adviser takes part when the shared
# policy enables it, its credential is present, and it is not disabled in the
# user's preferences. Agent tool
# dispatch accepts aliases only, so references/hosts.md maps these profiles to
# `model: opus` or `model: sonnet` with explicit effort. Most substantive work
# runs at `high`; the `decision` profile keeps `xhigh` for planning, architecture
# and diagnosis.
profiles:
  substantive:
    model: claude-opus-5-5
    effort: high
    scope: substantive
  decision:
    model: claude-opus-5-5
    effort: xhigh
    scope: substantive
  bounded_execution:
    model: claude-opus-5-5
    effort: high
    scope: bounded_execution
  github:
    model: claude-sonnet-5-5
    effort: medium
    scope: bounded_execution
  bounded_evidence:
    model: claude-opus-5-5
    effort: high
    scope: bounded_evidence

roles:
  coordinator: substantive
  coding: substantive
  testing: substantive
  planning: decision
  architecture: decision
  review: substantive
  diagnosis: decision
  documentation: substantive
  issue_management: substantive
  pr_authoring: substantive
  pr_authoring_routine: github
  commit_execution: github
  pr_submission: github
  lookup: bounded_evidence
  summarization: bounded_evidence

unknown_role_profile: substantive
