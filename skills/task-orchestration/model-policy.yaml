version: 3

# Read this file for each substantial task. It guides the coordinator; the host
# does not load these settings natively or switch a running session's model.
# On Codex these profiles apply directly. Claude Code uses model-policy.claude.yaml
# for profiles and roles, and shares everything else here.
# Authorized model/effort and role edits are validated against supported settings
# and scope relationships. Consultation checkpoints and publication safeguards
# stay mandatory; which advisers take part follows consultation.providers below,
# for those not disabled in the user's preferences.
activation:
  any_of:
    - independent_workstreams
    - cross_component_change
    - consequential_uncertainty
  bypass: small_edits_and_direct_factual_answers

profiles:
  # Profile names and the sol_* keys below are stable identifiers the validator
  # requires. `sol` is the substantive profile, whichever model it runs.
  sol:
    model: gpt-6.1-sol
    reasoning_effort: max
    user_requested_efforts: [xhigh, ultra]
    scope: substantive
  luna_execution:
    model: gpt-6-luna
    reasoning_effort: xhigh
    user_requested_efforts: []
    scope: bounded_execution
  github:
    model: gpt-6-luna
    reasoning_effort: high
    user_requested_efforts: []
    scope: bounded_execution
  luna:
    model: gpt-6-luna
    reasoning_effort: high
    user_requested_efforts: []
    scope: bounded_evidence

effort_policy:
  default_substantive: max
  max_for_sol: configured_or_explicit_user_request
  configured_max_profiles: [sol]
  automatic_escalation: false

effort_guidance:
  ultra: Available for Sol only on explicit user request; task-directed delegation remains available at other efforts.
  max: Configured default for substantive Sol 6.1 work; delegate useful independent assignments according to the task.
  xhigh: Configured default for other bounded execution; GitHub execution uses high. Promote uncertain scope or new consequential claims to substantive ownership.
  comparison: Compare actual quality, total tokens, and elapsed time for equivalent work; effort labels alone do not establish depth, cost, or savings.

roles:
  coordinator: sol
  coding: sol
  testing: sol
  planning: sol
  architecture: sol
  review: sol
  diagnosis: sol
  documentation: sol
  issue_management: sol
  pr_authoring: sol
  pr_authoring_routine: github
  commit_execution: github
  pr_submission: github
  lookup: luna
  summarization: luna

lookup_boundary: bounded_read_only_evidence_without_consequential_conclusions
unknown_role_profile: sol
fixed_specialists:
  context_explorer:
    respect_runtime_model: true
    scope: evidence_gathering_only

fallbacks:
  # Optional, role-specific override on every host, including Claude Code.
  # Without this key, historical profile fallbacks retain their meaning.
  github_unavailable: report_blocker
  luna_unavailable: sol
  sol_unavailable: compatible_coordinator_or_report_blocker
  advisers_unavailable_or_inconclusive: continue_with_source_evidence_and_conservative_routing

# An activated substantial task with an open decision keeps both checkpoints:
# before implementation (or substantive drafting/review), and again during final
# review against the completed work and current checks, before completion or
# publication, and so does one changing code that must behave alike on several
# platforms or shells. Otherwise its plan declares checkpoints not required,
# with a reason; when in doubt, it keeps them. Advisers
# take part only when configured: listed under providers below, with their
# credential present (TYPESAFE_API_KEY, SUBQ_API_KEY, OPENAI_API_KEY), and not
# disabled in the user's preferences. With none
# configured, the coordinator still holds each checkpoint and decides on source
# evidence and checks under the same rules. Each checkpoint is a separate evidence
# batch; reuse is limited to the same checkpoint. Record bounded attempts,
# restricted sharing, unavailable providers, and the coordinator's disposition at
# each checkpoint. No automatic retries. Checkpoint timing is skill instruction,
# not a native manager policy field.
consultation:
  deadline_seconds: 30
  attempts_per_evidence_batch: 1
  automatic_retries: false
  questions: references/question-patterns.json
  ownership: task_coordinator
  reuse: unchanged_evidence_decisions_question_meaning_and_model
  sharing: minimal_evidence_within_task_authorization
  comparison: coordinator_evidence_and_verification
  # Enabled providers and their pinned models; an empty mapping ({}) enables none.
  # Jev is opt-in. To enable it, add this line:
  #   jev: jev-1.14.0
  # It is off by default because of a measurement over 261 adjudicated
  # consultations (587 resolved questions, 30 splits): Jev was the only adviser
  # matching the verified decision in 0 of the 30 splits, was overruled 14 times
  # and was unavailable 23 times. Snap matched 587/587, which suggests deference
  # to Snap rather than independent verification.
  providers:
    subq_snap: subq-snap-preview
    openai_decisions: gpt-6-luna

publication:
  authority: user_request_and_carried_authorization
  analysis_output: draft
  refresh_before_write: true
  readback_after_write: true
  uncertain_outcome: reconcile_before_retry
