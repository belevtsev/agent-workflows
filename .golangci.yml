version: "2"

linters:
  default: none
  enable:
    - errcheck
    - funlen
    - gocognit
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    funlen:
      lines: 80
      statements: -1
      ignore-comments: true
    gocognit:
      min-complexity: 30
    gocyclo:
      min-complexity: 20
    errcheck:
      # A command prints to the terminal; a failed print has no better report.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.Root).Remove
        - golang.org/x/sys/unix.Unlinkat
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1005
        - -QF*
  exclusions:
    rules:
      # cw runs the programs a repository declares and reads the files it is
      # pointed at: a variable command and a variable path are its job.
      - linters: [gosec]
        text: "G104:"
      - linters: [gosec]
        text: "G204:"
      - linters: [gosec]
        text: "G304:"
      # G703 is the same finding as G304, by taint analysis.
      - linters: [gosec]
        text: "G703:"
      # What cw writes lives in the git directory and the working tree, and
      # follows git's own modes: a hook file must be executable, cw.toml and
      # the records are as readable as the files next to them.
      - linters: [gosec]
        text: "G(301|302|306):"
      # The sweep walks cw's own store, which only the user can write.
      - path: internal/store/
        linters: [gosec]
        text: "G122:"
      # The harness of the scenario tests builds fixtures, as tests do.
      - path: internal/cwtest/
        linters: [gosec]
      # Tests build fixtures: files, commands and loose permissions.
      - path: _test\.go
        linters: [gosec]
        text: "G(101|115|122|204|301|302|306|404|602|702|703|704):"
      - path: _test\.go
        linters: [errcheck]
        text: 'Error return value of `([^`]*\.Close|[^`]*\.Remove|[^`]*\.RemoveAll|[^`]*\.Setenv|[^`]*\.Unsetenv)` is not checked'
      # A test function is as long as its cases.
      - path: _test\.go
        linters: [funlen, gocognit, gocyclo]
