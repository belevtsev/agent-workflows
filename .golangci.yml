# golangci-lint v2 configuration. CI pins the linter version in
# .github/workflows/ci.yml; docs/development.md lists the local commands.
# third_party/ is a separate module, so ./... does not reach it.
version: "2"

linters:
  default: none
  enable:
    - errcheck
    - funlen
    - gocognit
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    # Complexity ratchet (QR-45): the start thresholds of the quality review
    # (section 5.5); the targets are gocognit 30, funlen 80 and gocyclo 20.
    # Today's offenders are listed by function under exclusions below.
    funlen:
      lines: 120
      statements: -1
      ignore-comments: true
    gocognit:
      min-complexity: 60
    gocyclo:
      min-complexity: 30
    errcheck:
      exclude-functions:
        # The os.Root and unix forms of os.Remove: best-effort removal of a
        # temporary or lock file on a cleanup path, everywhere.
        - (*os.Root).Remove
        - golang.org/x/sys/unix.Unlinkat
    misspell:
      ignore-rules:
        # "hardlinked" (two names for one inode) is a word here, not a
        # misspelling of "hardline".
        - hardlinked
    staticcheck:
      checks:
        - all
        # golangci-lint's defaults: comment and naming style checks.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Error strings are user-facing sentences that cw prints as they are,
        # many starting with a proper noun such as "Git".
        - -ST1005
        # Quick fixes (QF) are refactoring suggestions, not defects.
        - -QF*
  exclusions:
    rules:
      # G104 repeats errcheck, which is configured above.
      - linters: [gosec]
        text: "G104:"
      # G304: cw is a local command run by the user it serves. It opens the
      # files that user names on the command line or that live in its own
      # state, cache and task directories; a variable path is its purpose.
      - linters: [gosec]
        text: "G304:"
      # Tests only, rule by rule: fake secrets in fixtures (G101); conversions
      # of test-made values (G115); files, modes and walks under t.TempDir
      # (G122, G301, G302, G306, G703); git, go and the test binary itself run
      # with test-chosen arguments (G204, G702); math/rand for non-secret data
      # (G404); key/value and parallel slices the test sized (G602); dials to a
      # local test listener (G704). Production code gets none of these.
      - path: _test\.go
        linters: [gosec]
        text: "G(101|115|122|204|301|302|306|404|602|702|703|704):"
      # errcheck (F13): the std-error-handling preset is gone, so new code
      # checks every result. Today's unchecked results stay excluded per
      # package and function; fix a package's sites and delete its rule.
      # The list only shrinks.
      # cmd/cw (tests): closes of fixture files and locks, whose failure the test assertions would show.
      - path: ^cmd/cw/[^/]*_test\.go$
        linters: [errcheck]
        text: 'Error return value of `([^`]*\.Close)` is not checked'
      # cmd/cwdev (tests): closes of fixture files and locks, whose failure the test assertions would show.
      - path: ^cmd/cwdev/[^/]*_test\.go$
        linters: [errcheck]
        text: 'Error return value of `([^`]*\.Close)` is not checked'
      # internal/cli (production): closes of read handles, directories and locks, and closes on an error path after a failed write; best-effort removal of a temporary file on a cleanup path; diagnostics and reports printed to the command's stdout or stderr.
      - path: ^internal/cli/[^/]*([^t]|[^s]t|[^e]st|[^t]est|[^_]test)\.go$
        linters: [errcheck]
        text: 'Error return value of `([^`]*\.Close|[^`]*\.Remove|fmt\.Fprint|fmt\.Fprintf|fmt\.Fprintln)` is not checked'
      # internal/cli (tests): closes of fixture files and locks, whose failure the test assertions would show; test environment set up and restored by the test itself.
