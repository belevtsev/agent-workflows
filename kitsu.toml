# The checks this repository requires before a commit or a push.
# `kitsu run` executes them; the git hooks that `kitsu init` installs enforce them.
version = 1

[[check]]
id = "build"
run = ["go", "build", "./..."]

[[check]]
id = "vet"
run = ["go", "vet", "./..."]

[[check]]
id = "test"
run = ["go", "test", "-count=1", "./..."]
timeout = "20m"

[[check]]
id = "lint"
run = ["golangci-lint", "run", "./..."]
timeout = "10m"

# The two change folders under openspec/changes/ obey the rules of a record.
[[check]]
id = "record"
run = ["kitsu", "change", "check"]
