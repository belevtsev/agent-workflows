# Release archives for kitsu, built by .github/workflows/release.yml on v* tags.
version: 2

project_name: kitsu

builds:
  - id: kitsu
    main: ./cmd/kitsu
    binary: kitsu
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Tag }} -X main.revision={{ .FullCommit }} -X main.builtAt={{ .CommitDate }}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: kitsu
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - THIRD_PARTY.md
      - licenses/*

# One file lists the SHA-256 of every archive and every SBOM.
checksum:
  name_template: SHA256SUMS
  algorithm: sha256

# One SBOM per archive, made by syft, published with the release as
# <archive>.sbom.json. The release job installs syft.
sboms:
  - id: archives
    artifacts: archive

changelog:
  use: github
  sort: asc
  filters:
    # Drop docs, test and chore commits, with or without a scope: chore: and
    # chore(release): both go. A breaking one (chore!: or chore(x)!:) stays,
    # since users need to see it.
    exclude:
      - '^docs(\([^)]*\))?:'
      - '^test(\([^)]*\))?:'
      - '^chore(\([^)]*\))?:'

# A draft: release.yml makes it public after it has attested the archives.
release:
  github:
    owner: belevtsev
    name: kitsu
  draft: true
  # A second run for the same tag replaces the draft of the first.
  replace_existing_draft: true
  prerelease: auto
