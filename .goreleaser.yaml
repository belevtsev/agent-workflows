# Release archives built by CI and the protected release workflow.
version: 2

project_name: kitsu

before:
  hooks:
    - python3 .github/scripts/package-plugin.py .kitsu-release-plugin/kitsu-plugin.zip

builds:
  - id: kitsu
    main: ./cmd/kitsu
    binary: kitsu
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Tag }} -X main.revision={{ .FullCommit }} -X main.builtAt={{ .CommitDate }}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: kitsu
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - THIRD_PARTY.md
      - licenses/*

# One file lists the SHA-256 of every archive and every SBOM.
checksum:
  name_template: SHA256SUMS
  algorithm: sha256
  extra_files:
    - glob: install.sh
    - glob: install.ps1
    - glob: .kitsu-release-plugin/kitsu-plugin.zip

# One SBOM per archive, made by syft, published with the release as
# <archive>.sbom.json. The release job installs syft.
sboms:
  - id: archives
    artifacts: archive

changelog:
  use: github
  sort: asc
  filters:
    # Drop docs, test and chore commits, with or without a scope: chore: and
    # chore(release): both go. A breaking one (chore!: or chore(x)!:) stays,
    # since users need to see it.
    exclude:
      - '^docs(\([^)]*\))?:'
      - '^test(\([^)]*\))?:'
      - '^chore(\([^)]*\))?:'

# The protected release workflow publishes the verified bundle.
release:
  disable: true
